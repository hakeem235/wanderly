# fly.toml for apps/web
# Deploy with: fly deploy --config infra/fly/web.fly.toml --dockerfile apps/web/Dockerfile

app = "wanderly-web"
primary_region = "ams"

[build]
  dockerfile = "apps/web/Dockerfile"
  build_target = "runner"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
