services:
  mongo:
    image: mongo:7
    container_name: wanderly-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: wanderly
      MONGO_INITDB_ROOT_PASSWORD: wanderly
      MONGO_INITDB_DATABASE: wanderly
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Postgres kept for n8n only
  postgres:
    image: postgres:16-alpine
    container_name: wanderly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wanderly
      POSTGRES_PASSWORD: wanderly
      POSTGRES_DB: n8n
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wanderly"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wanderly-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass wanderly
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "wanderly", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  typesense:
    image: typesense/typesense:26.0
    container_name: wanderly-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_API_KEY: wanderly-typesense-key
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8108/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: wanderly-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: wanderly
      DB_POSTGRESDB_PASSWORD: wanderly
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: wanderly
      WEBHOOK_URL: http://localhost:5678
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  typesense_data:
  n8n_data:
